services:
  - type: web
    name: sbagro-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: sbagro-db
          property: connectionString

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: TURNSTILE_SECRET_KEY
        sync: false

databases:
  - name: sbagro-db
    databaseName: sbagro
    user: sbagro_user
